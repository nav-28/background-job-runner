# Full-stack local/prod-like environment: Postgres + migrations + Fastify backend + Next.js frontend.
#   docker compose up --build
# Then open http://localhost:3001 (frontend) — API is proxied to the backend.
#
# Migrations run automatically: the one-shot `migrate` service applies them once
# Postgres is healthy, and the backend waits for it to finish before starting.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ stores data in major-version subdirectories, so the mount
      # goes at /var/lib/postgresql — not /var/lib/postgresql/data.
      # https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d test"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot migration runner. Uses the official dbmate image rather than the
  # backend image, because the backend's production image installs --prod and
  # therefore has no dbmate (it's a devDependency).
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    command: --no-dump-schema up
    environment:
      DATABASE_URL: postgres://admin:test@postgres:5432/test?sslmode=disable
    volumes:
      # dbmate looks for ./db/migrations relative to its working directory.
      - ./backend/db:/db
    depends_on:
      postgres:
        condition: service_healthy

  # Web DB console for local inspection. Behind the `tools` profile so it never
  # starts as part of the normal stack:
  #   docker compose --profile tools up -d pgadmin   ->  http://localhost:5050
  # Do not enable this profile on a deployed host.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: test
      # Desktop mode, no master password: opens straight into the UI locally.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 5050
    ports:
      # Loopback only — this is a local tool, not something to expose.
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the local server, since `down -v` wipes pgadmin_data too.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      HOST: 0.0.0.0
      PORT: 3000
      POSTGRES_URL: postgres:5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      # Allow the browser-facing frontend origin (used if the client calls the API directly).
      CORS_ORIGIN: http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-in-production-0123456789}
      SESSION_TTL_SECONDS: 14400
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:3000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The Next.js server proxies /api/* to the backend container.
      BACKEND_URL: http://backend:3000
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmin_data:
